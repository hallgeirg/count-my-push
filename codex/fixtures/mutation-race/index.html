<!doctype html><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="bundle.css"><div id="root"></div><script>
const entries=[],requests=[],pending=[];let nextId=1,holdReads=false;const reads=[];
const snapshot=()=>{const total=entries.reduce((n,e)=>n+e.count,0);return {timeZone:'UTC',goals:{dailyGoal:100,weeklyGoal:700,monthlyGoal:3000},quickAdd:[10,20],totals:{daily:total,weekly:total,monthly:total},recentEntries:entries.slice()};};
window.mock={entries,requests,pending,reads,setHoldReads:v=>holdReads=v,releaseRead:i=>reads.splice(i,1)[0](),complete:i=>pending.splice(i,1)[0](true),fail:i=>pending.splice(i,1)[0](false),snapshot};
window.fetch=async(path,options={})=>{const method=options.method||'GET';requests.push({path,method});if(path.startsWith('/api/state')){const s=snapshot();if(holdReads)return new Promise(resolve=>reads.push(()=>resolve(Response.json(s))));return Response.json(s);}if(method==='POST')return new Promise(resolve=>pending.push(success=>{if(!success){resolve(Response.json({error:'Synthetic save failure'},{status:500}));return;}const entry={id:nextId++,count:JSON.parse(options.body).count,performedAt:new Date().toISOString()};entries.unshift(entry);resolve(Response.json({entry},{status:201}));}));if(method==='DELETE'){const id=Number(new URL(path,location.origin).searchParams.get('id'));entries.splice(entries.findIndex(e=>e.id===id),1);return Response.json({ok:true});}throw Error('Unexpected mock request');};
</script><script src="bundle.js"></script>
